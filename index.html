<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学食BAシミュレーション（v0.6 試作）</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede6; --text:#1f2328; --muted:#5f6670;
  --line:#dcd9cf; --accent:#1f6f5c; --accent-weak:#e1efe9; --accent-text:#ffffff;
  --ctr:#2b5fa8; --ctr-weak:#e3ecf8; --ctr-text:#ffffff;
  --warn:#b4530f; --warn-weak:#fbeadc; --bad:#b42318; --bad-weak:#fde4e1; --good:#1f7a3a; --good-weak:#e2f3e6;
  --card:#fff8e1; --card-line:#e9d9a0; --req:#e8eef8; --req-line:#a9bde0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --surface:#1f2226; --surface2:#2a2e33; --text:#e8e6e1; --muted:#a3a8ae;
    --line:#3a3f45; --accent:#5cc2a4; --accent-weak:#1f3a33; --accent-text:#0f1a17;
    --ctr:#7fb0ff; --ctr-weak:#1d2a40; --ctr-text:#0f1a2b;
    --warn:#f0a35e; --warn-weak:#3d2a1a; --bad:#f28b82; --bad-weak:#3e1f1d; --good:#7fd197; --good-weak:#1d3324;
    --card:#2f2a1a; --card-line:#5a4d25; --req:#1d2638; --req-line:#3d5280;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#1f2226; --surface2:#2a2e33; --text:#e8e6e1; --muted:#a3a8ae;
  --line:#3a3f45; --accent:#5cc2a4; --accent-weak:#1f3a33; --accent-text:#0f1a17;
  --ctr:#7fb0ff; --ctr-weak:#1d2a40; --ctr-text:#0f1a2b;
  --warn:#f0a35e; --warn-weak:#3d2a1a; --bad:#f28b82; --bad-weak:#3e1f1d; --good:#7fd197; --good-weak:#1d3324;
  --card:#2f2a1a; --card-line:#5a4d25; --req:#1d2638; --req-line:#3d5280;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;
  line-height:1.7;font-size:16px}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 140px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px 6px}
.top-inner{max-width:680px;margin:0 auto}
.top-row{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:2px 8px;font-size:12px;color:var(--muted)}
.bamap{margin-top:4px;font-size:11px}
.bamap .row{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:2px}
.bamap .row b{font-size:10px;color:var(--muted);width:100%;font-weight:600}
.bamap span{padding:1px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.bamap span.ctr{background:var(--ctr);border-color:var(--ctr);color:var(--ctr-text);font-weight:700}
.bamap span.par{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.bamap span.off{opacity:.35}
.bamap i{font-style:normal;color:var(--muted)}
.progress{height:4px;background:var(--surface2);border-radius:4px;margin-top:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
h1{font-size:22px;line-height:1.4;margin:24px 0 8px}
h2{font-size:19px;line-height:1.45;margin:22px 0 8px}
h3{font-size:16px;margin:18px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.ka{background:var(--ctr-weak);border-left:4px solid var(--ctr);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:14px}
.ka b{display:block;font-size:13px;color:var(--ctr)}
.say{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.say .who{font-size:12px;color:var(--muted)}
.qh{font-weight:700;margin:22px 0 6px;font-size:16px}
.qh .qn{display:inline-block;background:var(--ctr);color:var(--ctr-text);border-radius:6px;font-size:12px;padding:0 8px;margin-right:6px}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-weak)}
.opt:disabled{cursor:default}
.opt:disabled:not(.sel){opacity:.55}
.opt .t{font-weight:700;display:block}
.opt .d{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.btn{display:inline-block;background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;min-width:140px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.fb{border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--surface);border:1px solid var(--line)}
.fb.good{background:var(--good-weak);border-color:transparent}
.fb.warn{background:var(--warn-weak);border-color:transparent}
.fb.bad{background:var(--bad-weak);border-color:transparent}
.fb h3{margin-top:0}
.fb ul{margin:4px 0;padding-left:20px}
.newcard{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.newcard b{font-size:12px;display:block}
.newcard .meta{font-size:11px;color:var(--muted)}
.reqcard{background:var(--req);border:1px solid var(--req-line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.reqcard b{font-size:12px;display:block}
.reqcard .meta{font-size:11px;color:var(--muted)}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.drawer-inner{max-width:680px;margin:0 auto;padding:6px 16px}
.drawer button.toggle{width:100%;background:none;border:0;color:var(--text);font:inherit;font-weight:700;text-align:left;padding:4px 0;cursor:pointer}
.drawer .list{max-height:50vh;overflow:auto;padding-bottom:8px}
.count{display:inline-block;color:#fff;border-radius:999px;font-size:12px;padding:0 8px;margin-left:6px}
.count.i{background:var(--warn)} .count.r{background:var(--ctr)}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:10px 0}
.quiz .q{font-weight:700;margin-bottom:2px}
.quiz .src{font-size:12px;color:var(--muted);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;text-align:left}
.chip.sel{border-color:var(--accent);background:var(--accent-weak)}
.chip.right{border-color:var(--good);background:var(--good-weak)}
.chip.wrong{border-color:var(--bad);background:var(--bad-weak)}
.chip:disabled{cursor:default}
.chip:disabled:not(.sel):not(.right):not(.wrong){opacity:.5}
.chip.sq{border-radius:10px}
.ans{font-size:13px;margin-top:6px}
.meter{margin:10px 0}
.meter .lab{display:flex;justify-content:space-between;font-size:14px}
.meter .bar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:6px}
.ending{border-radius:14px;padding:16px;margin:16px 0;background:var(--surface);border:2px solid var(--accent)}
.ending .tag{font-size:12px;color:var(--muted)}
.ending h2{margin:4px 0 8px}
table.log{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
table.log th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}
table.grid{width:100%;border-collapse:collapse;font-size:12px;margin:8px 0}
table.grid th,table.grid td{border:1px solid var(--line);padding:4px 5px;text-align:center}
table.grid th:first-child,table.grid td:first-child{text-align:left}
table.grid th{background:var(--surface2);font-weight:600}
.ok{color:var(--good);font-weight:700} .mid{color:var(--warn);font-weight:700} .ng{color:var(--bad);font-weight:700}
.tech{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--surface);font-size:14px}
.tech.used{border-color:var(--accent);background:var(--accent-weak)}
.tech .nm{font-weight:700}
.badge{font-size:11px;border-radius:999px;padding:1px 8px;margin-left:6px;background:var(--accent);color:var(--accent-text)}
.note{font-size:12px;color:var(--muted)}
.hide{display:none}
.who{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:8px 12px;margin:8px 0}
.who .nm{font-weight:700}
.who .ds{font-size:12px;color:var(--muted)}
.who .ms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.mchip{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;text-align:left;line-height:1.35}
.mchip small{display:block;font-size:11px;color:var(--muted)}
.mchip.sel{border-color:var(--accent);background:var(--accent-weak)}
.mchip.done{border-style:dashed;opacity:.6}
.mchip:disabled{cursor:default}
.mchip.no{opacity:.45}
.who .why{font-size:11px;color:var(--muted);margin-top:4px}
textarea.pt{width:100%;min-height:96px;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;background:var(--surface);color:var(--text);resize:vertical}
.cost{display:flex;justify-content:space-between;font-size:14px;margin:6px 0}
.syn{font-size:13px;margin:4px 0}
.syn.warn{color:var(--warn)}
.syn.pre{color:var(--muted)}
.mark{font-size:11px;border-radius:999px;padding:0 8px;margin-left:6px;border:1px solid var(--line);font-weight:400}
.mark.tidy{background:var(--warn-weak);color:var(--warn);border-color:transparent}
.mark.done{background:var(--good-weak);color:var(--good);border-color:transparent}
.kv td:first-child{white-space:nowrap;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<header class="top"><div class="top-inner">
  <div class="top-row"><span id="stageLabel"></span><span>BAの全体図（青＝中心／緑＝並行／薄い＝まだ紹介していない）</span></div>
  <div class="bamap" id="bamap"></div>
  <div class="progress"><i id="prog"></i></div>
</div></header>
<main class="wrap" id="app"></main>
<div class="drawer hide" id="drawer"><div class="drawer-inner">
  <button class="toggle" id="drawerToggle">手持ちのカード <span class="count i" id="cntI">0</span><span class="count r" id="cntR">0</span> <span class="muted" id="drawerHint">（タップで開く）</span></button>
  <div class="list hide" id="cardList"></div>
</div></div>

<script>
"use strict";
// ============ データ ============
const BUDGET = 150; // 学生課の初年度予算（万円）

const KA = {
  sa:{short:"戦略分析",name:"戦略分析",text:"今の状態（現状）と、目指したい状態（将来）を比べ、その差から「本当に解くべき問題」を決めます。依頼主が口にした解決策をそのまま受け取らないことが大切です。"},
  ra:{short:"要求分析とデザイン定義",name:"要求分析とデザイン定義",text:"集めた情報を整理して要求として書き、種類に分け、要求を満たす解決策の案（デザイン）を決めます。"},
  se:{short:"ソリューション評価",name:"ソリューション評価",text:"解決策が本当に価値を生んだかを測ります。効果が出ない場合は、その原因を探して次の改善につなげます。結果によっては、最初の段階に戻ります。"},
  ba:{short:"計画とモニタリング",name:"ビジネスアナリシスの計画とモニタリング",text:"誰に・どの方法で・何を聞くかを計画し、進み具合を見て計画を直します。時間は限られているので、結果を見て見直すことも含まれます。"},
  el:{short:"引き出しとコラボレーション",name:"引き出しとコラボレーション",text:"関係者から情報を集め（引き出し）、内容を確認します。相手と方法の組み合わせによって、手に入る情報の量と深さが変わります。"},
  rl:{short:"要求ライフサイクル管理",name:"要求ライフサイクル管理",text:"要求に優先順位をつけ、出所（どの情報から来たか）をたどれる状態にし、変更が起きたら影響を確認して承認します。これはどの段階でも行います。"}
};
const SCR = {
  intro:{st:0,c:[],p:[]},
  s1:{st:1,c:["sa"],p:["el"]},
  s2a:{st:2,c:["el"],p:["ba"]},
  s2b:{st:2,c:["ba"],p:["el"]},
  s3a:{st:3,c:["ra"],p:["rl"]},
  s3b:{st:3,c:["ra"],p:["rl"]},
  s3c:{st:3,c:["ra"],p:["rl"]},
  s3d:{st:3,c:["ra"],p:["el","ba"]},
  s4:{st:4,c:["rl"],p:["ba","el"]},
  s5:{st:5,c:["se"],p:[]}
};
const STAGE_TITLE = {
  1:"何を問題とするか、どうなればよいかを決める",
  2:"誰から・どの方法で聞くかを計画し、結果を見て計画を直す",
  3:"集めた声を要求に整理し、解決策の部品を組み合わせて提案を書く",
  4:"想定外のできごとによる要求の変更に対応する",
  5:"1年後の結果で、解決策の効果を評価する"
};
const BLOCK = {s1:1,s2a:2,s2b:3,s3a:4,s3b:4,s3c:5,s3d:5,s4:6};
const BLOCK_END = {s1:1,s2a:2,s2b:3,s3b:4,s3d:5};
const BLOCK_MIN = {1:5,2:5,3:5,4:5,5:10,6:5}; // 作業時間の目安（分）
const LIT = {sa:1,el:2,ba:3,ra:4,rl:6,se:7}; // 知識エリアを紹介するブロック
const NEXT = {intro:"s1",s1:"s2a",s2a:"s2b",s2b:"s3a",s3a:"s3b",s3b:"s3c",s3c:"s3d",s3d:"s4",s4:"s5"};

const WHO = {
  student:{t:"学生",d:"学食を使う人・使わなくなった人"},
  staff:{t:"調理・レジのパート",d:"現場で毎日ピークを体験している"},
  manager:{t:"生協の店長",d:"食堂の運営者。大学とは別の組織で、独立採算"},
  kyomu:{t:"教務課の課長",d:"時間割や授業時間を担当する部署"},
  jyoshi:{t:"情報センター",d:"学内ネットワークとセキュリティを管理する部署"},
  minority:{t:"留学生",d:"少数派だが、影響を受けやすい人たち"},
  zaimu:{t:"財務課の課長",d:"大学の予算を管理する部署"},
  shisetsu:{t:"施設課",d:"食堂の建物・机・椅子を管理する部署"}
};
const METHOD = {
  interview:{t:"インタビュー",s:"インタビュー"},
  survey:{t:"アンケート",s:"アンケート"},
  observe:{t:"観察（現場を見る）",s:"観察"},
  workshop:{t:"ワークショップ",s:"ワークショップ"},
  prototype:{t:"プロトタイピング（画面の試作を見せる）",s:"試作を見せる"},
  benchmark:{t:"ベンチマーク（他大学の事例調査）",s:"事例調査"}
};
const MKEYS = ["interview","survey","observe","workshop","prototype"];
const c = (lv,n,dep,f,text)=>({ok:true,lv,n,dep,f,text});
const x = why=>({ok:false,why});

// 相手×方法ごとに決まっている結果。f＝この情報カードから分かること（要求の候補や、できごとの条件に使う）
const HEAR = {
  student:{
    interview:c(3,"5人","深く聞ける",["seat","timeshift","userfit"],"並ぶのもつらいけど、一番困るのは席が空いていないこと。空いている時間がわかれば、ずらしてもいい。"),
    survey:c(3,"640人","数字で分かる",["stats","timeshift","pre","userfit"],"「学食を使いたいが時間がない」45%。「混雑状況がわかれば時間をずらす」58%。「スマホで事前注文したい」41%。"),
    observe:c(2,"食堂の利用者","実際の行動",["seat","stay"],"食事時間は平均12分なのに、席にいる時間は平均35分。食後にスマホや課題をしている人が多い。"),
    workshop:c(2,"6人","意見をまとめられる",["seat","agree"],"学生6人で話し合い、「席が空かないこと」と「ピークの30分の行列」を優先する課題にすることで合意した。"),
    prototype:c(2,"3人","画面を見ての意見",["pre","proto","userfit"],"紙の画面試作を見せたら「注文完了まで4画面は長い」「受取時間を選べるなら使う」と言われた。")
  },
  staff:{
    interview:c(3,"3人","深く聞ける",["kitchen","bottle"],"混むのは30分だけ。そのために人を増やすと前後は手が余る。事前注文が同じ時刻に大量に来たら、フライヤーが足りない。昼は返却口にも列ができる。"),
    survey:c(1,"8人","数字にならない",[],"回答は8人だけ。「忙しい」「返却口が詰まる」という声はあるが、人数が少なく、数字としては使えない。"),
    observe:c(3,"現場全体","実際の様子",["bottle","kitchen"],"レジだけでなく返却口にも列。バーコード決済は、昔のICカードより会計に時間がかかっている。12:20から調理場の手が回っていない。"),
    workshop:x("勤務時間中は、現場を離れて参加できない"),
    prototype:c(1,"2人","限られる",[],"レジ側の画面の試作を見せた。「会計の手順が増えると困る」という指摘はあったが、利用者の意見ではない。")
  },
  manager:{
    interview:c(2,"1人","経営の事情まで聞ける",["coop","profit"],"生協は大学とは別の組織で、独立採算。システムの月額や決済手数料（売上の約3%）を払う余裕はない。本音は、ピーク以外の時間にも来てほしい。"),
    survey:x("1人なので、集計しても意味がない"),
    observe:c(1,"1人","限られる",[],"売り場の様子は見えたが、経営の事情や費用の話は見えなかった。"),
    workshop:c(2,"3人（店長・学生課・学生）","立場をまたいで話せる",["coop","profit","agree"],"店長・学生課・学生で話し、運用費を誰がどう負担するかの論点を整理できた。目的を「ピークの30分をどう乗り切るか」に絞ることで一致した。"),
    prototype:x("運用や費用の事情は、画面の試作では分からない")
  },
  kyomu:{
    interview:c(2,"1人","承認の手順が聞ける",["timetable"],"昼休みを延ばすには時間割の全面見直しが必要。教授会の承認がいるので、早くて再来年度から。近くの大学では、昼休みが縮んで学生の不満が出て、授業時間を元に戻した例がある。"),
    survey:x("対象が少なく、集計できない"),
    observe:x("現場で見るものがない"),
    workshop:x("課長は日程が合わず、参加できない"),
    prototype:x("時間割の話に、画面の試作は関係しない")
  },
  jyoshi:{
    interview:c(2,"2人","ルールが聞ける",["privacy"],"学内Wi-Fiにつなぐ機器や、外部のクラウドにデータを送るサービスは、セキュリティ審査（約2か月）が必要。カメラは特に慎重に扱う。人数を数えるだけなら、映像を保存しない方式がある。"),
    survey:x("対象が少なく、集計できない"),
    observe:x("現場で見るものがない"),
    workshop:x("審査担当は、検討の場には参加できない"),
    prototype:c(1,"1人","限られる",["privacy"],"画面の試作を見せたら「学籍番号を外部に送る設計は審査が必要」と指摘された。")

const UID = (()=>{

  if(!COLLECT_URL) return;
  const t=Date.now()*100+(seq++%100);
  items.forEach(it=>sendQ.push({q:it.q,v:it.v,t,n:0}));
  flush();
}
async function flush(){
  if(sending||!sendQ.length) return;
  sending=true;
  const batch=sendQ.splice(0,20);
  let retry=false;
  try{
    const r=await fetch(COLLECT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({uid:UID,items:batch.map(({q,v,t})=>({q,v,t}))})});
    const j=await r.json();
    if(!j.ok && j.retry) retry=true;
  }catch(e){ retry=true; }
  sending=false;
  if(retry){
    sendQ.unshift(...batch.filter(it=>++it.n<6));
    setTimeout(flush, 3000+Math.random()*5000);
  } else if(sendQ.length) flush();
}

// ============ 講師の合図（方式A） ============
// 受付中は、各ワークの終わりで講師が「次を開く」を押すまで先へ進めない。
// 待っている間だけ、COLLECT_URL?m=state を約10秒おきに確認する。確認が3回続けて失敗したら、待たずに進める。
const BLK_OF = scr => scr==="s5" ? 7 : (BLOCK[scr]||0);
const GATE = {known:false, open:false, n:0, fail:0, free:false, timer:null, busy:false};
function gated(target){
  if(!COLLECT_URL || GATE.free) return false;
  const need = BLK_OF(target);
  if(need <= BLK_OF(S.screen)) return false;
  if(!GATE.known) return true;
  return GATE.open && GATE.n < need;
}
function pendingTarget(){
  const s = S.screen;
  if(s==="intro") return "s1";
  if(S.decided && (BLOCK_END[s] || (s==="s4" && S.ev===S.events.length-1))) return NEXT[s];
  return null;
}
function waiting(){ const t = pendingTarget(); return !!t && gated(t); }
function pollGate(){
  GATE.timer = null;
  if(GATE.busy || !COLLECT_URL || GATE.free || !waiting()) return;
  GATE.busy = true;
  const was = waiting();
  fetch(COLLECT_URL+"?m=state", {cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(!j || !j.ok) throw new Error("state");
    GATE.known = true; GATE.open = !!j.open; GATE.n = +j.released || 0; GATE.fail = 0;
  }).catch(()=>{ if(++GATE.fail >= 3) GATE.free = true; }).then(()=>{
    GATE.busy = false;
    const now = waiting();
    if(was !== now){ const y0=window.scrollY; render(); window.scrollTo(0,y0); }
    else syncGate();
  });
}
function syncGate(){
  if(!waiting()){ clearTimeout(GATE.timer); GATE.timer = null; return; }
  if(GATE.timer || GATE.busy) return;
  const wait = !GATE.known ? 0 : GATE.fail ? 3000+Math.random()*2000 : 7000+Math.random()*6000;
  GATE.timer = setTimeout(pollGate, wait);
}

function totalCost(P=S.parts){
  let t=0; P.forEach(k=>{ t+=PARTS[k].cost; });

  if(P.includes("seats") && hasFact("facility")) t-=15; // 基準に収まる範囲に絞る
  if(P.includes("pilot")){ const f=focalPart(P); if(f) t-=Math.round((PARTS[f].cost-(f==="visual"&&hasFact("bench")?20:0))*0.3); }
  return t;
}

// ---- 要求と組み合わせの対応（✓満たす／△条件つき／✕満たさない）----
function fitOf(id,P=S.parts){
  const h=k=>P.includes(k), cost=totalCost(P);
  const by=(yes,part)=> yes.some(h)?"✓" : part.some(h)?"△":"✕";
  switch(id){
    case "g1": return by(["app","shift"],["visual","ret","kc","layout","cashier","menu"]);
    case "g2": return cost<=BUDGET?"✓":(cost<=BUDGET*1.2?"△":"✕");
    case "g3": return (h("app")||h("visual"))?"△":"✓";
    case "r_seat": return by(["ret","layout"],["shift","kc","seats"]);
    case "r_time": return by(["visual"],["app","pilot"]);
    case "r_pre": return by(["app"],[]);
    case "r_vis": return by(["visual"],[]);
    case "r_noph": return h("app")?"△":"✓";
    case "r_lang": return (h("app")||h("visual"))?"△":"✓";
    case "r_coop": return h("app")?"✕":(h("visual")||h("kc")||h("cashier"))?"△":"✓";
    case "r_sales": return by(["app","kc"],["visual","ret","shift","cashier"]);
    case "r_kit": return h("app")&&!h("ret")?(h("menu")?"△":"✕"):"✓";
    case "r_ret": return by(["ret"],["layout"]);
    case "r_sec": return (h("app")||h("visual"))?"△":"✓";
    case "r_fac": return h("seats")?(h("layout")?"△":"✕"):"✓";
    case "r_train": return h("pilot")?"✓":(h("ret")||h("app")||h("kc")||h("cashier")||h("menu"))?"△":"✕";
    case "r_fund": return (cost<=BUDGET||h("pilot"))?"✓":(cost<=BUDGET*1.2?"△":"✕");
  }
  return "△";
}
const fitCls = s=>s==="✓"?"ok":(s==="△"||s==="？")?"mid":"ng";

// ---- 提案の弱点 ----
function weaknesses(){
  const w=[], P=S.parts;
  const miss=[...new Set(P.flatMap(k=>REL[k]||[]))].filter(a=>!hasWho(a));
  if(miss.length) w.push({id:"who",t:"選んだ部品に関わる相手のうち、聞けていない人がいる："+miss.map(a=>WHO[a].t).join("、")});
  const ev=S.evid.map(cardOf);
  const whos=new Set(ev.filter(k=>k.who).map(k=>k.who));
  if(ev.length && whos.size<=1 && !ev.some(k=>k.key==="data"||k.key==="bench")) w.push({id:"one",t:"根拠にしたカードが、1つの相手の声だけに偏っている"});
  if(!hasFact("stats")) w.push({id:"num",t:"アンケートやデータなど、全体の数字の裏付けがない"});
  if(!hasMethod("observe") && S.first!=="floor" && (hasPart("ret")||hasPart("layout")||hasPart("app")||hasPart("cashier"))) w.push({id:"obs",t:"現場の実際の様子を見ていない"});
  return w;
}

// ============ 画面の流れ ============
function go(screen){
  history.push(entrySnap);
  S.screen = screen; S.decided = false; S.newCards = [];
  if(screen==="s3a"){ S.quizIds = QUIZ_ORDER.filter(reqAvail).slice(0,3); }
  if(screen==="s4"){ S.events = buildEvents(); S.ev = 0; report([{q:"events",v:S.events.slice()}]); }
  if(screen==="s5"){ const e=evaluate(); report([{q:"end",v:{e:e.ending,eff:e.eff,sat:e.sat,cost:e.cost,risk:e.risk}}]); }
  entrySnap = JSON.stringify(S);
  render(); window.scrollTo(0,0);
}
function back(){
  if(!history.length) return;
  entrySnap = history.pop(); S = JSON.parse(entrySnap);
  render(); window.scrollTo(0,0);
}

// ============ できごと ============
function buildEvents(){
  // 起きるできごとは、選んだ部品で決まる。聞いていない相手のものを先に出し、聞いていたものは後ろに回す
  const top=[], miss=[], ok=[];
  const add=(k,cond,asked)=>{ if(cond) (asked?ok:miss).push(k); };
  if(totalCost()>BUDGET && !mustHas("g2")) top.push("budget");
  if(hasPart("seats") && !hasFact("facility")) top.push("seats");
  add("coop", itPart() && !mustAny(["r_coop"]), hasFact("coop"));
  add("privacy", itPart() && !mustAny(["g3","r_sec"]), hasFact("privacy"));
  add("intl", hasPart("app") && !mustAny(["r_noph","r_lang"]), hasFact("intl"));
  add("kitchen", hasPart("app") && !hasPart("ret") && !hasPart("menu") && !mustAny(["r_kit"]), hasFact("kitchen"));
  add("kcprofit", hasPart("kc"), hasFact("coop"));
  add("slow", hasPart("shift") && !hasPart("visual"), true);
  const all=top.concat(miss,ok);
  S.extraEv = all.slice(3);
  return all.slice(0,3).concat(["scope"]);
}

// ============ 評価 ============
function evaluate(){
  const goal=S.goal, c=S.center, P=S.parts, aux=P.filter(k=>k!==c);
  let eff=EFFECT[c][goal], cost=totalCost(), sat=50, risk=20, limit=BUDGET, raised=false;
  const notes=[];
  if(S.first==="data") eff+=4;
  if(S.first==="floor"){ sat+=2; if(c==="ret") eff+=5; }
  if(S.first==="boss"){ sat+=4; risk-=3; }
  if(c==="ret" && hasMethod("observe")) eff+=10;
  if(c==="visual"){ if(hasMethod("survey")) eff+=10; if(hasMethod("benchmark")) eff+=5; if(hasMethod("prototype")) eff+=5; }
  if(c==="app"){ if(hasMethod("prototype")) eff+=10; if(hasMethod("benchmark")) eff+=5; }
  if(c==="kc" && hasWho("student")) eff+=5;
  if(c==="cashier"){ if(hasFact("bottle")) eff+=8; else risk+=8; }
  if(c==="seats" && hasFact("facility")) eff-=15;
  if(hasPart("menu") && !hasFact("kitchen")) sat-=3;
  aux.forEach(k=>{ eff+=AUX[k][goal]; });
  synergies().forEach(s=>{ eff+=s.eff||0; sat+=s.sat||0; risk+=s.risk||0; });
  if(mustHas("g1")) eff+=5;
  if(mustHas("g2") && cost>BUDGET){ eff-=10; cost=BUDGET; notes.push(`「初年度の費用を${BUDGET}万円以内」をMustにしていたので、最初から予算内に収まる設計にしました（効果は少し下がります）。`); }
  const whos=new Set(S.iv.filter(k=>k!=="bench").map(k=>k.split(".")[0]));
  sat+=Math.min(15,3*whos.size);
  if(hasMethod("workshop")) sat+=8;
  if(hasMethod("interview")&&hasWho("student")) sat+=3;
  if(mustHas("r_noph")) sat+=5;
  const unsorted=S.musts.filter(r=>tidy(r));
  if(unsorted.length){ sat-=2*unsorted.length; notes.push("種類の整理が済んでいない要求をMustにしたため、組み合わせが満たすかどうかを判定できませんでした："+unsorted.map(r=>REQS[r].t).join("、")+"。"); }
  const miss=S.musts.filter(r=>r!=="g2" && !tidy(r) && fitOf(r)==="✕");
  if(miss.length){ sat-=4*miss.length; notes.push("Mustにした要求のうち、今の組み合わせでは満たされないものがあります："+miss.map(r=>REQS[r].t).join("、")+"。"); }
  if(c==="app" && !hasFact("userfit") && !hasPart("pilot")) risk+=15;
  if(itPart() && !hasWho("jyoshi")) risk+=10;
  if(hasPart("kc")) risk+=10;
  if(hasPart("pilot")) risk-=15;
  if(S.wk==="ask") sat+=3;
  if(S.wk==="cond") risk-=5;
  if(S.wk==="scope"){ risk-=5; eff-=3; }
  if(S.wk==="none") risk+=5;

  let flag=null, cancels=0;
  S.events.forEach(e=>{
    const ch=S.evChoice[e]; if(!ch) return;
    const o=EVENTS[e].opts().find(z=>z.id===ch); if(!o) return;
    const f=o.fx;
    if(f.flag==='cancel') cancels++; else if(f.flag) flag=flag||f.flag;
    if(f.raise) raised=true;
    if(f.eff) eff+=f.eff; if(f.sat) sat+=f.sat; if(f.risk) risk+=f.risk;
    if(f.costSet!==undefined) cost=f.costSet;
    if(f.cost) cost+=f.cost;
  });

  let ending=c;
  const pen=(why)=>{ eff-=15; sat-=15; risk+=15; notes.push(why); };
  if(cancels===1){ eff-=10; sat-=25; risk+=20; notes.push("お金や運用の事情を後回しにした判断で調整が長引き、関係者の信頼が下がりました。"); }
  if(cancels>=2){ ending="cancel"; eff=0; cost=Math.min(cost,30); sat=Math.min(sat,25); risk=Math.max(risk,70); }
  else if(flag==="scandal" && (c==="app"||c==="visual")){ ending="scandal"; sat-=30; risk=90; eff=Math.min(eff,20); }
  else if(flag==="overflow" && c==="app"){ ending="overflow"; eff=Math.min(eff,15); sat-=20; risk+=20; }
  else if(flag==="kcleave" && c==="kc"){ ending="kcleave"; eff=Math.min(eff,10); sat-=10; }
  else if(flag==="scandal") pen("補助にした部品のプライバシーの問題で、評判が下がりました。");
  else if(flag==="overflow") pen("補助にした部品の注文が集中し、現場に負担がかかりました。");
  else if(flag==="kcleave") pen("補助にしたキッチンカーが撤退し、分散の効果がなくなりました。");
  else if(c==="app" && !hasFact("userfit") && !hasPart("pilot")){ ending="unused"; eff=Math.min(eff,20); sat-=10; }
  if(raised){ limit=Math.max(BUDGET,cost); if(cost>BUDGET) notes.push(`予算の追加（合計${cost}万円）が認められました。`); }
  if(cost>limit && ending!=="cancel"){ risk+=10; notes.push(`最終的な費用が予算（${BUDGET}万円）を超えています。`); }
  const cl=v=>Math.max(0,Math.min(100,Math.round(v)));
  return {eff:cl(eff),sat:cl(sat),risk:cl(risk),cost,ending,notes};
}

function reqCardHtml(id,pri){
  const chg=S.chg.filter(z=>z.req===id).map(z=>`${z.st}（${z.ev}）`).join(" → ");
  return `<div class="reqcard"><b>📋 要求カード｜${tidy(id)?"種類：要整理":RT[REQS[id].ty]}${pri?`｜優先順位：${pri}`:""}</b>${esc(REQS[id].t)}<span class="meta">${esc(reqSource(id))}${chg?`<br>変更履歴：${esc(chg)}`:""}</span></div>`;
}
function reqCards(){
  const cs=[];
  S.musts.forEach(r=>cs.push(reqCardHtml(r,"Must")));
  if(S.wont && S.wont!=="none") cs.push(reqCardHtml(S.wont,"Won't（今回はやらない）"));
  S.chg.filter(z=>z.req==="new").forEach(z=>cs.push(`<div class="reqcard"><b>📋 要求カード｜追加の要求</b>クーポン配信・学内イベントのお知らせ<span class="meta">出所：生協・学生課からの依頼　状態：${esc(z.st)}</span></div>`));
  return cs;
}
function nav(nextLabel, nextAct, canNext){
  const [k,x]=nextAct.split(":"), g = k==="to" && gated(x);
  return `<div class="actions">${history.length?`<button class="btn ghost" data-act="back">ひとつ前に戻る</button>`:""}<button class="btn" data-act="${nextAct}" ${canNext&&!g?"":"disabled"}>${g?"合図を待っています…":nextLabel}</button></div>`;
}

function overviewHtml(){
  const m=SCR[S.screen];
  const ch=id=>`<span class="${!lit(id)?"off":m.c.includes(id)?"ctr":m.p.includes(id)?"par":""}">${KA[id].short}</span>`;
  return `<div class="row"><b>順番に進める3つ</b>${["sa","ra","se"].map(ch).join("<i>→</i>")}</div><div class="row"><b>どの段階でも行う3つ（順番はない）</b>${["ba","el","rl"].map(ch).join("")}</div>`;
}
function renderChrome(){
  const n=SCR[S.screen].st, b=BLOCK[S.screen];
  $("#stageLabel").textContent = n ? `Stage ${n} / 5${b?`　ワーク ${b} / 6（目安 ${BLOCK_MIN[b]}分）`:""}` : "はじめに";
  $("#prog").style.width = (n/5*100)+"%";
  $("#bamap").innerHTML = overviewHtml();
  const ic=infoCards(), rc=reqCards();
  $("#drawer").classList.toggle("hide", ic.length===0&&rc.length===0);
  $("#cntI").textContent = "情報"+ic.length;
  $("#cntR").textContent = "要求"+rc.length;
  $("#cardList").innerHTML = ic.map(infoCardHtml).join("")+rc.join("")+`<p class="note">※ カードの数値は、実際の事例を参考にした想定値です。</p>`;
}

function matrixHtml(max){
  const done=S.iv, sel=S.plan;
  const who=Object.keys(WHO).map(w=>{
    const cells=MKEYS.map(m=>{
      const k=w+"."+m, h=HEAR[w][m], isDone=done.includes(k), isSel=sel.includes(k);
      if(!h.ok) return `<button class="mchip no" disabled>${METHOD[m].s} ✕</button>`;
      const dis=isDone || (!isSel && sel.length>=max);
      return `<button class="mchip ${isSel?"sel":""} ${isDone?"done":""}" data-act="pl:${k}" ${dis?"disabled":""}>${METHOD[m].s}<small>${isDone?"実施済み":esc(h.n+"・"+h.dep)}</small></button>`;
    }).join("");
    const whys=MKEYS.filter(m=>!HEAR[w][m].ok).map(m=>`${METHOD[m].s}：${HEAR[w][m].why}`).join("／");
    return `<div class="who"><div class="nm">${WHO[w].t}</div><div class="ds">${WHO[w].d}</div><div class="ms">${cells}</div>${whys?`<div class="why">できない方法 — ${esc(whys)}</div>`:""}</div>`;
  }).join("");
  const bk=!done.includes("bench");
  const bsel=sel.includes("bench");
  const bench=`<div class="who"><div class="nm">相手を選ばない方法：事例調査（他大学）</div><div class="ds">1回として数えます</div><div class="ms"><button class="mchip ${bsel?"sel":""} ${!bk?"done":""}" data-act="pl:bench" ${(!bk||(!bsel&&sel.length>=max))?"disabled":""}>事例調査<small>${bk?esc(BENCH.n+"・"+BENCH.dep):"実施済み"}</small></button></div></div>`;
  return `<p class="muted">ボタンの下に、聞ける人数と、得られる情報の深さが出ます。✕＝その相手にはできない方法。選択中：${sel.length} / ${max}</p>${who}${bench}`;
}

function partsPanel(){
  const P=S.parts; if(!P.length) return "";
  const cost=totalCost();
  const cc=cost<=BUDGET*0.6?"ok":cost<=BUDGET?"mid":"ng";
  const syn=synergies().map(s=>`<div class="syn ${s.pre?"warn":""}">${s.pre?"⚠ ":"✔ "}${s.t}</div>`).join("");
  const fit=S.musts.length?`<table class="grid"><tr><th>Mustの要求カード</th><th>この組み合わせ</th></tr>${S.musts.map(r=>{const f=tidy(r)?"？":fitOf(r);return `<tr><td>${esc(REQS[r].t)}</td><td class="${fitCls(f)}">${f}</td></tr>`;}).join("")}</table><p class="note">✓満たす／△条件つき／✕満たさない／？種類が未確定（要整理）で判定できない。満たす数が多いほど良い、とは限りません。費用・リスク・現場の事情も合わせて判断します。</p>`:"";
  return `<div class="fb"><h3>この組み合わせの見通し</h3><div class="cost"><span>初年度の費用の見積もり（予算${BUDGET}万円）</span><b class="${cc}">${cost}万円</b></div>${syn||`<div class="syn muted">相性や前提の指摘は、今のところありません。</div>`}${fit}</div>`;
}
const partDesc = k=>{

function decide(scr){

  if(scr==="s1"){ S.goal=S.prob; report([{q:"fm",v:S.first},{q:"pb",v:S.prob},{q:"ms",v:S.measure}]); }
  if(scr==="s2a"){ S.iv=S.iv.concat(S.plan); addNew(S.plan); report([{q:"pu",v:S.purpose},{q:"pl",v:S.plan.slice()}]); S.plan=[]; }
  if(scr==="s2b"){
    S.gapBefore=gapNow();
    S.iv=S.iv.concat(S.plan); addNew(S.plan); S.gapAfter=gapNow();
    report([{q:"gp",v:S.gap},{q:"ad",v:S.plan.slice()}]); S.plan=[];
  }
  if(scr==="s3a") report([{q:"qz",v:S.quizIds.map(id=>id+"="+S.quiz[id])}]);
  if(scr==="s3b") report([{q:"mu",v:S.musts.slice()},{q:"wn",v:S.wont},{q:"cr",v:S.crit}]);
  if(scr==="s3c") report([{q:"pa",v:S.parts.slice()},{q:"ce",v:S.center},{q:"wo",v:S.worry}]);
  if(scr==="s3d") report([{q:"evd",v:S.evid.slice()},{q:"wk",v:S.wk}]);
  if(scr==="s4"){
    const key=S.events[S.ev], ch=S.evChoice[key], E=EVENTS[key], o=E.opts().find(z=>z.id===ch);
    (E.aff.length?E.aff:["new"]).forEach(r=>{ if(r==="new"||S.musts.includes(r)) S.chg.push({req:r,st:o.st||"変更して承認",ev:E.title.replace(/[「」]/g,"")}); });
    report([{q:"ev_"+key,v:ch}]);
  }
}

  if(k==="nextev"){ history.push(entrySnap); S.ev++; S.decided=false; S.newCards=[]; entrySnap=JSON.stringify(S); render(); window.scrollTo(0,0); return; }
  if(k==="decide"){ decide(x1); render(); return; }
  if(k==="fm") S.first = x1;
  if(k==="pb") S.prob=x1;
  if(k==="ms") S.measure=x1;
  if(k==="pu") S.purpose=x1;
  if(k==="pl") toggle(S.plan,x1,S.screen==="s2a"?4:2);
  if(k==="gp") S.gap=x1;
  if(k==="q") S.quiz[x1]=+x2;
  if(k==="mu") toggle(S.musts,x1,3);
  if(k==="wn") S.wont=x1;
  if(k==="cr") S.crit=x1;
  if(k==="pa"){ toggle(S.parts,x1,3); if(S.center && !S.parts.includes(S.center)) S.center=null; }
  if(k==="ce") S.center=x1;
  if(k==="wo") S.worry=x1;
  if(k==="ev1") toggle(S.evid,x1,3);
  if(k==="wk") S.wk=x1;
  if(k==="ev") S.evChoice[S.events[S.ev]]=x1;
  const y0=window.scrollY; render(); window.scrollTo(0,y0);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  act(b.dataset.act);
});
document.addEventListener("input",ev=>{
  if(ev.target && ev.target.id==="ptext"){ S.pText=ev.target.value; const p=$("#pcount"); if(p) p.textContent=[...S.pText].length+"字"; }
});
$("#drawerToggle").addEventListener("click",()=>{
  const l=$("#cardList"); l.classList.toggle("hide");
  $("#drawerHint").textContent = l.classList.contains("hide")?"（タップで開く）":"（タップで閉じる）";
});
render();
</script>
</body>
</html>
