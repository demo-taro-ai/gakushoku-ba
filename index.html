<!doctype html>
<html lang="ja">

<meta charset="utf-8">

<title>学食BAシミュレーション</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface2:#efede6; --text:#1f2328; --muted:#5f6670;
  --line:#dcd9cf; --accent:#1f6f5c; --accent-weak:#e1efe9; --accent-text:#ffffff;

}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16181b; --surface:#1f2226; --surface2:#2a2e33; --text:#e8e6e1; --muted:#a3a8ae;
    --line:#3a3f45; --accent:#5cc2a4; --accent-weak:#1f3a33; --accent-text:#0f1a17;
    --warn:#f0a35e; --warn-weak:#3d2a1a; --bad:#f28b82; --bad-weak:#3e1f1d; --good:#7fd197; --good-weak:#1d3324;
    --card:#2f2a1a; --card-line:#5a4d25;
  }
}
:root[data-theme="dark"]{
  --bg:#16181b; --surface:#1f2226; --surface2:#2a2e33; --text:#e8e6e1; --muted:#a3a8ae;
  --line:#3a3f45; --accent:#5cc2a4; --accent-weak:#1f3a33; --accent-text:#0f1a17;
  --warn:#f0a35e; --warn-weak:#3d2a1a; --bad:#f28b82; --bad-weak:#3e1f1d; --good:#7fd197; --good-weak:#1d3324;
  --card:#2f2a1a; --card-line:#5a4d25;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Meiryo",sans-serif;

.wrap{max-width:680px;margin:0 auto;padding:0 16px 120px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 8px}
.top-inner{max-width:680px;margin:0 auto}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.baccm span{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.baccm span.on{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.progress{height:4px;background:var(--surface2);border-radius:4px;margin-top:6px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
h1{font-size:22px;line-height:1.4;margin:24px 0 8px}
h2{font-size:19px;line-height:1.45;margin:22px 0 8px}
h3{font-size:16px;margin:18px 0 6px}
p{margin:8px 0}
.muted{color:var(--muted);font-size:14px}
.ka{background:var(--accent-weak);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:14px 0;font-size:14px}

.say .who{font-size:12px;color:var(--muted)}

.opt{display:block;width:100%;text-align:left;background:var(--surface);color:var(--text);border:2px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;cursor:pointer}

.opt.sel{border-color:var(--accent);background:var(--accent-weak)}
.opt:disabled{cursor:default}
.opt:disabled:not(.sel){opacity:.55}
.opt .t{font-weight:700;display:block}
.opt .d{font-size:13px;color:var(--muted);display:block;margin-top:2px}
.opt .pc{display:grid;grid-template-columns:auto 1fr;gap:0 6px;font-size:12px;margin-top:6px;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:12px 20px;font:inherit;font-weight:700;cursor:pointer;min-width:140px}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.fb{border-radius:12px;padding:12px 14px;margin:14px 0;background:var(--surface);border:1px solid var(--line)}
.fb.good{background:var(--good-weak);border-color:transparent}
.fb.warn{background:var(--warn-weak);border-color:transparent}
.fb.bad{background:var(--bad-weak);border-color:transparent}
.fb h3{margin-top:0}
.newcard{background:var(--card);border:1px solid var(--card-line);border-radius:10px;padding:8px 12px;margin:8px 0;font-size:14px}
.newcard b{font-size:12px;display:block}
.drawer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -4px 16px rgba(0,0,0,.08)}
.drawer-inner{max-width:680px;margin:0 auto;padding:8px 16px}
.drawer button.toggle{width:100%;background:none;border:0;color:var(--text);font:inherit;font-weight:700;text-align:left;padding:6px 0;cursor:pointer}
.drawer .list{max-height:45vh;overflow:auto;padding-bottom:8px}
.count{display:inline-block;background:var(--warn);color:#fff;border-radius:999px;font-size:12px;padding:0 8px;margin-left:6px}
.quiz{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:12px 0}
.quiz .q{font-weight:700;margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer}
.chip.sel{border-color:var(--accent);background:var(--accent-weak)}
.chip.right{border-color:var(--good);background:var(--good-weak)}
.chip.wrong{border-color:var(--bad);background:var(--bad-weak)}
.chip:disabled{cursor:default}
.ans{font-size:13px;margin-top:6px}
.meter{margin:10px 0}
.meter .lab{display:flex;justify-content:space-between;font-size:14px}
.meter .bar{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:6px}

.ending .tag{font-size:12px;color:var(--muted)}

table.log{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
table.log th,table.log td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top;text-align:left}
table.log th{font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap}

.tech.used{border-color:var(--accent);background:var(--accent-weak)}

.note{font-size:12px;color:var(--muted)}
.hide{display:none}

// ============ 回答の集計（匿名） ============
// GASウェブアプリのURL（集計/集計の準備手順.md を参照）。空のときは何も送らない
const COLLECT_URL = "https://script.google.com/macros/s/AKfycbxvcyobiUEiVW8I4wfD2AWj-0nNaLyTBcAnhnyVyb3gxmn2pF9v_DsjrqY1MMnG_pP2/exec";
const UID = (()=>{
  const mk = ()=>(Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2)).replace(/[^a-z0-9]/g,"").slice(0,16).padEnd(12,"0");
  try{ let u=localStorage.getItem("gakushoku_ba_uid"); if(!u||!/^[a-z0-9]{8,24}$/.test(u)){ u=mk(); localStorage.setItem("gakushoku_ba_uid",u); } return u; }
  catch(e){ return mk(); }
})();
let sendQ=[], sending=false, seq=0;
function report(items){
  if(!COLLECT_URL) return;
  const t=Date.now()*100+(seq++%100);   // 端末時刻＋連番。同じ問いは新しい方で上書き集計される
  items.forEach(it=>sendQ.push({q:it.q,v:it.v,t,n:0}));
  flush();
}
async function flush(){
  if(sending||!sendQ.length) return;
  sending=true;
  const batch=sendQ.splice(0,20);
  let retry=false;
  try{
    const r=await fetch(COLLECT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({uid:UID,items:batch.map(({q,v,t})=>({q,v,t}))})});
    const j=await r.json();
    if(!j.ok && j.retry) retry=true;      // 受付停止中（closed）は再送しない
  }catch(e){ retry=true; }
  sending=false;
  if(retry){
    sendQ.unshift(...batch.filter(it=>++it.n<6));
    setTimeout(flush, 3000+Math.random()*5000);
  } else if(sendQ.length) flush();
}
window.addEventListener("online",flush);

function go(screen){
  history.push(entrySnap);
  S.screen = screen; S.decided = false; S.newCards = []; S.seatMsg = false;
  if(screen==="s5"){ S.events = buildEvents(); S.ev = 0; report([{q:"events",v:S.events.slice()}]); }
  if(screen==="s6"){ const e=evaluate(); report([{q:"end",v:{e:e.ending,eff:e.eff,sat:e.sat,cost:e.cost,risk:e.risk}}]); }
  entrySnap = JSON.stringify(S);
  render(); window.scrollTo(0,0);
}
function back(){
  if(!history.length) return;
  entrySnap = history.pop(); S = JSON.parse(entrySnap);
  render(); window.scrollTo(0,0);
}

// ============ 計算 ============
const mustHas = r => S.musts.includes(r);
const isIT = () => S.sol==="app" || S.sol==="visual";
function solCost(k){
  let c = SOL[k].cost;
  if(k==="visual" && S.tech.includes("benchmark")) c -= 20;
  return c;
}
const baseCost = () => solCost(S.sol);

function buildEvents(){
  const ev = [];
  if(baseCost()>BUDGET && !mustHas("r6")) ev.push("budget");
  if(isIT() && !S.sh.includes("manager")) ev.push("coop");
  if(isIT() && !S.sh.includes("jyoshi") && !mustHas("r5")) ev.push("privacy");
  if(S.sol==="app" && !S.sh.includes("minority") && !mustHas("r3")) ev.push("intl");
  if(S.sol==="app" && !S.sh.includes("staff") && !S.tech.includes("observe")) ev.push("kitchen");
  if(S.sol==="kc") ev.push("kcprofit");
  if(S.sol==="shift") ev.push("slow");
  ev.push("scope");
  return ev;
}

function evaluate(){
  const sol = S.sol, goal = S.goal, t = S.tech, sh = S.sh;
  let eff = EFFECT[sol][goal], cost = baseCost(), sat = 50, risk = 20;
  const notes = [];
  if(has("data")) eff+=5;
  if(sol==="ret" && t.includes("observe")) eff+=10;
  if(sol==="visual"){ if(t.includes("survey")) eff+=10; if(t.includes("benchmark")) eff+=5; if(t.includes("prototype")) eff+=5; }
  if(sol==="app"){ if(t.includes("prototype")) eff+=10; if(t.includes("benchmark")) eff+=5; }
  if(sol==="kc" && sh.includes("student")) eff+=5;
  if(mustHas("r1")) eff+=5;
  if(mustHas("r6") && cost>BUDGET){ eff-=10; cost=BUDGET; notes.push(`「初年度の費用を${BUDGET}万円以内」をMustにしていたので、最初から予算内に収まる設計にしました（効果は少し下がります）。`); }
  if(S.seatTried) sat-=5;
  if(goal==="sales") sat-=10;
  if(t.includes("interview")) sat+=10;
  if(t.includes("workshop")) sat+=10;
  if(sh.includes("student")) sat+=5;
  if(sh.includes("minority")) sat+=5;
  if(mustHas("r7")) sat+=5;
  const mismatch = (mustHas("r2")&&sol!=="app")||(mustHas("r4")&&sol!=="visual");
  if(mismatch) sat-=5;
  if(sol==="app" && !t.includes("prototype")) risk+=15;
  if(isIT() && !sh.includes("jyoshi")) risk+=10;
  if(sol==="shift" && !sh.includes("kyomu")) risk+=10;
  if(sol==="kc") risk+=10;

  let flag = null;
  S.events.forEach(e=>{
    const choice = S.evChoice[e]; if(!choice) return;
    const o = EVENTS[e].opts().find(x=>x.id===choice); if(!o) return;
    const f = o.fx;
    if(f.flag) flag = flag || f.flag;
    if(f.eff) eff+=f.eff; if(f.sat) sat+=f.sat; if(f.risk) risk+=f.risk;
    if(f.costSet!==undefined) cost = f.costSet;
    if(f.cost) cost+=f.cost;
  });

  let ending;
  const appSafe = t.includes("prototype")||t.includes("survey")||t.includes("benchmark")||(sh.includes("student")&&t.includes("interview"));
  if(flag==="cancel"){ ending="cancel"; eff=0; cost=Math.min(cost,30); sat=Math.min(sat,25); risk=Math.max(risk,70); }
  else if(flag==="scandal"){ ending="scandal"; sat-=30; risk=90; eff=Math.min(eff,20); }
  else if(flag==="overflow"){ ending="overflow"; eff=Math.min(eff,15); sat-=20; risk+=20; }
  else if(flag==="kcleave"){ ending="kcleave"; eff=Math.min(eff,10); sat-=10; }
  else if(sol==="app" && !appSafe){ ending="unused"; eff=Math.min(eff,20); sat-=10; }
  else ending = sol;
  if(cost>BUDGET && ending!=="cancel"){ risk+=10; notes.push(`最終的な費用が予算（${BUDGET}万円）を超えています。`); }
  const c = v=>Math.max(0,Math.min(100,Math.round(v)));
  return {eff:c(eff),sat:c(sat),risk:c(risk),cost,ending,notes,mismatch};
}

const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function ka(k){ return `<div class="ka"><b>この場面の知識エリア：${KA[k].name}</b>${KA[k].text}</div>`; }
function cardHtml(id){ const c=CARDS[id]; return `<div class="newcard"><b>🗂 ${esc(c.from)}</b>${esc(c.text)}</div>`; }
function newCardsHtml(){ return S.newCards.length ? `<h3>新しい発見カード</h3>`+S.newCards.map(cardHtml).join("") : ""; }
function nav(nextLabel, nextFn, canNext){
  return `<div class="actions">${history.length?`<button class="btn ghost" data-act="back">ひとつ前に戻る</button>`:""}<button class="btn" data-act="${nextFn}" ${canNext?"":"disabled"}>${nextLabel}</button></div>`;
}

function renderChrome(){
  const n = STAGE_NO[S.screen];
  $("#stageLabel").textContent = n ? `Stage ${n} / 6` : "はじめに";
  $("#prog").style.width = (n/6*100)+"%";
  $("#baccm").innerHTML = BACCM.map((b,i)=>`<span class="${BACCM_ON[S.screen].includes(i)?"on":""}">${b}</span>`).join("");
  $("#drawer").classList.toggle("hide", S.cards.length===0);
  $("#cardCount").textContent = S.cards.length;
  $("#cardList").innerHTML = S.cards.map(cardHtml).join("");
}

const R = {};
R.intro = ()=>`
  <h1>学食の昼休み問題を解決せよ<br><span class="muted">ビジネスアナリスト体験シミュレーション</span></h1>
  <p>舞台は、学生数およそ7,500人の「とある大学」。昼休みは<b>45分</b>、食堂は約550席です。</p>
  <p>あなたは、大学の学生課から相談を受けた新人のビジネスアナリスト（BA）です。</p>
  <div class="say"><div class="who">学生課の課長（依頼主）</div>学生アンケートで、食堂の満足度が学内施設の最下位でした。「昼休みに食べられない」という苦情も毎週届きます。予算は初年度${BUDGET}万円。他の大学みたいに、スマホで注文できるアプリでも入れればいいんでしょうか？</div>
  <p>BAの仕事は、すぐに何かを作ることではありません。<b>本当の問題は何か、誰が何を必要としているかを整理し、価値のある解決策を選ぶこと</b>です。</p>
  <p>これから6つの場面で判断していきます。それぞれの場面は、BAの知識体系「BABOK」の6つの知識エリアに対応しています。選び方によって、手に入る情報も、最後の結末も変わります。</p>
  <p class="muted">画面上部の「BACCM」は、BAが考えるべき6つのコア概念です。進むにつれて埋まっていきます。集めた情報は、画面下の「発見カード」にたまります。</p>
  <div class="actions"><button class="btn" data-act="to:s1">はじめる</button></div>
  ${COLLECT_URL?`<p class="note">※ 選んだ内容は、名前や学籍番号を含まない形で集計し、授業中に「全体でどう分かれたか」を見せるためだけに使います。成績には関係しません。</p>`:""}
  <p class="note">※ 大学・人物は架空です。数値や出来事は、日本の大学で実際に起きていることを参考にしています。</p>`;

R.s1 = ()=>{
  const d=S.decided;
  let fb="";
  if(d){
    const m={wait:["good","待ち時間を目的にしました。利用者の困りごとに近い捉え方です。"],
      seat:["good","席の回転を目的にしました。行列の原因が「座れないこと」なら有効な捉え方です。"],
      sales:["warn","生協の利用者と売上を目的にしました。運営者の関心には合いますが、学生の困りごとからは少しずれています。"],
      data:["good","結論を急がず、まず現状を数字で確かめました。ピークの時間に来店が集中し、待ち時間が一番の問題だとわかりました。目的は「待ち時間を短くする」になります。"]}[S.s1];
    fb=`<div class="fb ${m[0]}"><h3>結果</h3>${m[1]}<p class="muted">ポイント：課長は「アプリを入れる」という解決策を口にしましたが、BAはまず問題を定義します。現状と将来の姿の差（ギャップ）が、解くべき問題です。</p></div>${newCardsHtml()}`;
  }
  return `<h2>Stage 1　問題をどう捉える？</h2>${ka("s1")}
  <div class="say"><div class="who">学生課の課長</div>とにかく昼が大変なんです。行列もすごいし、席も空いていないし、最近は学食を使わない学生も増えたと生協さんが言っていて……。</div>
  <p>この相談の「問題」をどう定義しますか？</p>
  <div class="opts">${Object.entries(GOALS).map(([k,g])=>`<button class="opt ${S.s1===k?"sel":""}" data-act="s1:${k}" ${d?"disabled":""}><span class="t">${g.t}</span><span class="d">${g.d}</span></button>`).join("")}</div>
  ${d?fb+nav("Stage 2へ","to:s2",true):nav("決定","decide:s1",!!S.s1)}`;
};

R.s2 = ()=>{
  const d=S.decided;
  let fb="";
  if(d){
    const miss = Object.keys(SH).filter(k=>!S.sh.includes(k)).map(k=>SH[k].t).join("、");
    fb=`<div class="fb"><h3>結果</h3>3者から話を聞けることになりました。<p class="muted">選ばなかった人：${miss}。この人たちの声は、後で思わぬ形で届くかもしれません。</p><p class="muted">ポイント：関係者を洗い出したら、影響の大きさや関心の強さで優先順位をつけます。少数派の人や、お金・ルールを握る人を忘れると、後で困ります。</p></div>${newCardsHtml()}`;
  }
  return `<h2>Stage 2　誰に話を聞く？</h2>${ka("s2")}
  <p>依頼主の学生課とは話ができています。期間は2週間。ほかに話を聞けるのは<b>3者まで</b>です。誰に聞きますか？</p>
  <p class="muted">選択中：${S.sh.length} / 3</p>
  <div class="opts">${Object.entries(SH).map(([k,g])=>`<button class="opt ${S.sh.includes(k)?"sel":""}" data-act="s2:${k}" ${d?"disabled":""}><span class="t">${g.t}</span><span class="d">${g.d}</span></button>`).join("")}</div>
  ${d?fb+nav("Stage 3へ","to:s3",true):nav("決定","decide:s2",S.sh.length===3)}`;
};

R.s3 = ()=>{
  const d=S.decided;
  let fb="";
  if(d){
    const lines=S.tech.map(k=>`<li><b>${TECH[k].t}</b>：${TECH[k].ex}</li>`).join("");
    fb=`<div class="fb"><h3>結果</h3><ul>${lines}</ul><p class="muted">ポイント：技法にはそれぞれ得意・不得意があります。聞くだけでは、本人も気づいていない行動はわかりません。数えるだけでは、理由はわかりません。組み合わせて弱みを補います。</p></div>${newCardsHtml()}`;
  }
  return `<h2>Stage 3　どうやって声を集める？</h2>${ka("s3")}
  <p>選んだ3者（${S.sh.map(k=>SH[k].t).join("、")}）などから情報を集めます。使える方法は<b>2つまで</b>です。</p>
  <p class="muted">選択中：${S.tech.length} / 2</p>
  <div class="opts">${Object.entries(TECH).map(([k,g])=>`<button class="opt ${S.tech.includes(k)?"sel":""}" data-act="s3:${k}" ${d?"disabled":""}><span class="t">${g.t}</span><span class="pc"><span>◎</span><span>${g.good}</span><span>△</span><span>${g.weak}</span></span></button>`).join("")}</div>
  ${d?fb+nav("Stage 4へ","to:s4a",true):nav("決定","decide:s3",S.tech.length===2)}`;
};

R.s4a = ()=>{
  const d=S.decided;
  const done = QUIZ.every((_,i)=>S.quiz[i]!==undefined);
  const right = QUIZ.filter((q,i)=>S.quiz[i]===q.a).length;
  const items = QUIZ.map((q,i)=>`<div class="quiz"><div class="q">${i+1}. 「${q.q}」</div><div class="chips">${QUIZ_TYPES.map((t,j)=>{
      let cls = S.quiz[i]===j?"sel":"";
      if(d){ if(j===q.a) cls="right"; else if(S.quiz[i]===j) cls="wrong"; }
      return `<button class="chip ${cls}" data-act="q:${i}:${j}" ${d?"disabled":""}>${t}</button>`;}).join("")}</div>
      ${d?`<div class="ans">${S.quiz[i]===q.a?"⭕":"❌"} ${q.why}</div>`:""}</div>`).join("");
  return `<h2>Stage 4-1　要求を分類しよう</h2>${ka("s4")}
  <p>集まった声を、要求の種類に分けます。それぞれどれにあたるでしょう？</p>${items}
  ${d?`<div class="fb ${right>=4?"good":"warn"}"><h3>${right} / 5 問正解</h3><p class="muted">種類に分けると、「誰のための要求か」「システムに何をさせるか」「どのくらいの品質が必要か」が整理できます。</p></div>`+nav("次へ","to:s4b",true):nav("答え合わせ","decide:s4a",done)}`;
};

R.s4b = ()=>{
  const d=S.decided;
  let fb="";
  if(d){
    fb=`<div class="fb"><h3>Mustにした要求</h3><ul>${S.musts.map(r=>`<li>${REQS[r].t}</li>`).join("")}</ul><p class="muted">ポイント：MoSCoW法では、要求を Must（必須）／Should（できれば）／Could（余裕があれば）／Won't（今回はやらない）に分けます。Mustが多すぎると、何も削れなくなります。</p></div>`;
  }
  return `<h2>Stage 4-2　優先順位をつけよう</h2>
  <p>次の要求のうち、絶対に外せない「Must」を<b>3つまで</b>選んでください。Mustにした要求は、後の判断に影響します。</p>
  <p class="muted">選択中：${S.musts.length} / 3</p>
  <div class="opts">${Object.entries(REQS).map(([k,r])=>`<button class="opt ${S.musts.includes(k)?"sel":""}" data-act="s4b:${k}" ${d?"disabled":""}><span class="t">${r.t}</span><span class="d">${r.k}</span></button>`).join("")}</div>
  ${d?fb+nav("次へ","to:s4c",true):nav("決定","decide:s4b",S.musts.length>=1)}`;
};

function solAvailable(k){
  if(k==="ret") return has("staff")||has("bottleneck");
  if(k==="shift") return has("kyomu");
  if(k==="seats") return !S.seatTried;
  return true;
}
R.s4c = ()=>{
  const d=S.decided;
  const avail = Object.keys(SOL).filter(solAvailable);
  const locked = ["ret","shift"].filter(k=>!solAvailable(k)).length;
  let fb="";
  if(S.seatMsg){
    fb+=`<div class="fb bad"><h3>施設課から待ったがかかりました</h3>「食堂の机と椅子は、消防法の通路幅の基準でもう限界です。これ以上は置けません」<p class="muted">一見簡単な解決策にも、見えていない制約があります。別の案を選び直してください。</p></div>`;
  }
  if(d){
    const e=evaluate();
    fb+=`<div class="fb"><h3>「${SOL[S.sol].t}」に決めました</h3>
      <p>初年度の見積もり：約${baseCost()}万円（予算${BUDGET}万円）</p>
      ${e.mismatch?`<p class="muted">⚠ Mustにした要求と、選んだ解決策が合っていません。要求と解決策のつながりを確認しましょう。</p>`:""}
      <p class="muted">ポイント：解決策は、要求を満たすかどうか、費用、リスクなどで比べて選びます。システムを作らない解決策も立派な選択肢です。</p></div>`;
  }
  return `<h2>Stage 4-3　解決策を選ぼう</h2>
  <p>ここまでの発見カードをふまえて、解決策を1つ選びます。</p>
  <div class="opts">${avail.map(k=>`<button class="opt ${S.sol===k?"sel":""}" data-act="s4c:${k}" ${d?"disabled":""}><span class="t">${SOL[k].t}</span><span class="d">${SOL[k].d}　／　初年度 約${solCost(k)}万円</span></button>`).join("")}</div>
  ${locked?`<p class="muted">🔒 情報が足りないため、見えていない解決策が ${locked} つあります。</p>`:`<p class="muted">🔓 集めた情報のおかげで、すべての解決策が選択肢に出ています。</p>`}
  ${fb}
  ${d?nav("Stage 5へ","to:s5",true):nav("決定","decide:s4c",!!S.sol)}`;
};

R.s5 = ()=>{
  const key=S.events[S.ev], E=EVENTS[key], d=S.decided, ch=S.evChoice[key];
  const opts=E.opts();
  let fb="";
  if(d){ const f=E.fb[ch]; fb=`<div class="fb ${f[0]}"><h3>結果</h3>${f[1]}</div>`; }
  const last = S.ev===S.events.length-1;
  const skipped=[];
  if(S.ev===0){
    if(mustHas("r6") && baseCost()>BUDGET) skipped.push(`「${BUDGET}万円以内」をMustにしていたので、予算の問題は設計の段階で解決済みです。`);
    if(isIT() && S.sh.includes("manager")) skipped.push("生協の店長と、運用費の分担を最初に話し合えていました。");
    if(isIT() && (S.sh.includes("jyoshi")||mustHas("r5"))) skipped.push("プライバシーの扱いは、"+(S.sh.includes("jyoshi")?"情報センターに聞いていたので":"Mustにしていたので")+"最初から対策済みです。");
    if(S.sol==="app" && (S.sh.includes("minority")||mustHas("r3"))) skipped.push("スマホを使えない人への配慮は、最初から設計に入っています。");
    if(S.sol==="app" && (S.sh.includes("staff")||S.tech.includes("observe"))) skipped.push("厨房の調理能力を把握していたので、受取時刻の集中に備えられています。");
  }
  return `<h2>Stage 5　想定外のできごと（${S.ev+1} / ${S.events.length}）</h2>${S.ev===0?ka("s5"):""}
  ${skipped.length?`<div class="fb good"><h3>前半の判断が効いています</h3><ul>${skipped.map(s=>`<li>${s}</li>`).join("")}</ul></div>`:""}
  <div class="say"><div class="who">${E.who}</div><b>${E.title}</b></div>
  <p>${E.text()}</p>
  <div class="opts">${opts.map(o=>`<button class="opt ${ch===o.id?"sel":""}" data-act="ev:${o.id}" ${d?"disabled":""}><span class="t">${o.ws?"🤝 ":""}${o.t}</span><span class="d">${o.d}</span></button>`).join("")}</div>
  ${d?fb+nav(last?"結果を見る（Stage 6）":"次のできごとへ", last?"to:s6":"nextev", true):nav("決定","decide:s5",!!ch)}`;
};

function meter(label,val,good,suffix){
  const color = good ? (val>=60?"var(--good)":val>=35?"var(--warn)":"var(--bad)") : (val<=35?"var(--good)":val<=60?"var(--warn)":"var(--bad)");
  return `<div class="meter"><div class="lab"><span>${label}</span><b>${suffix}</b></div><div class="bar"><i style="width:${val}%;background:${color}"></i></div></div>`;
}
R.s6 = ()=>{
  const e=evaluate(), en=ENDINGS[e.ending];
  const costPct=Math.min(100,Math.round(e.cost/(BUDGET*2)*100));
  const costColor = e.cost<=BUDGET*0.6?"var(--good)":e.cost<=BUDGET?"var(--warn)":"var(--bad)";
  const evLog = S.events.map(k=>{const o=EVENTS[k].opts().find(x=>x.id===S.evChoice[k]);return `${EVENTS[k].title} → ${o?o.t:"-"}`;}).join("<br>");
  const right = QUIZ.filter((q,i)=>S.quiz[i]===q.a).length;
  const log = [
    ["1","戦略分析",GOALS[S.s1].t],
    ["2","計画とモニタリング",S.sh.map(k=>SH[k].t).join("、")],
    ["3","引き出しとコラボレーション",S.tech.map(k=>TECH[k].t).join("、")],
    ["4","要求分析とデザイン定義",`分類クイズ ${right}/5 ／ Must：${S.musts.map(r=>REQS[r].t).join("、")} ／ 解決策：${S.seatTried?"（席の増設は施設課が却下）→ ":""}${SOL[S.sol].t}`],
    ["5","要求ライフサイクル管理",evLog],
    ["6","ソリューション評価",en.t]
  ];
  const h=hints();
  return `<h2>Stage 6　1年後の結果</h2>${ka("s6")}
  <div class="ending"><div class="tag">${en.tag}</div><h2>${en.t}</h2><p>${en.story}</p></div>
  ${meter("効果（混雑の改善）",e.eff,true,e.eff+" / 100")}
  ${meter("関係者の満足度",e.sat,true,e.sat+" / 100")}
  <div class="meter"><div class="lab"><span>初年度の費用（予算${BUDGET}万円）</span><b>${e.cost}万円</b></div><div class="bar"><i style="width:${costPct}%;background:${costColor}"></i></div></div>
  ${meter("リスク（炎上・中止・反発）",e.risk,false,e.risk+" / 100")}
  ${e.notes.map(n=>`<p class="muted">※ ${n}</p>`).join("")}

  <h2>あなたのBA判断ログ</h2>
  <table class="log"><tr><th>Stage</th><th>知識エリア</th><th>あなたの選択</th></tr>
  ${log.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table>

  ${h.length?`<h3>別の選択をしていたら……</h3><ul>${h.map(x=>`<li>${x}</li>`).join("")}</ul>`:""}

  <h2>聞き方の図鑑</h2>
  <p class="muted">BABOKには50の技法が載っています。今回はそのうち6つを使いました。</p>
  ${Object.entries(TECH).map(([k,g])=>`<div class="tech ${S.tech.includes(k)?"used":""}"><span class="nm">${g.t}</span>${S.tech.includes(k)?`<span class="badge">使った</span>`:""}<div>◎ ${g.good}</div><div>△ ${g.weak}</div><div class="muted">今回なら：${g.ex}</div></div>`).join("")}

  <div class="actions"><button class="btn ghost" data-act="back">ひとつ前に戻る</button><button class="btn" data-act="restart">最初からもう一度</button></div>
  <p class="note">※ 大学・人物は架空です。数値や出来事は日本の大学の実例を参考にした設定です。参考：BABOK Guide v3（IIBA）</p>`;
};

function render(){ renderChrome(); $("#app").innerHTML = R[S.screen](); }

// ============ 操作 ============
function toggle(arr,k,max){ const i=arr.indexOf(k); if(i>=0) arr.splice(i,1); else if(arr.length<max) arr.push(k); }
function decide(scr){
  if(scr==="s1"){ S.goal = S.s1==="data" ? "wait" : S.s1; if(S.s1==="data") addCard("data"); }
  if(scr==="s2"){ S.sh.forEach(addCard); }
  if(scr==="s3"){
    const t=S.tech;
    if(t.includes("interview")) S.sh.forEach(k=>addCard(k+"_deep"));
    if(t.includes("survey")) addCard("survey");
    if(t.includes("observe")) addCard("bottleneck");
    if(t.includes("workshop")) addCard("workshop");
    if(t.includes("prototype")) addCard("prototype");
    if(t.includes("benchmark")) addCard("benchmark");
  }
  if(scr==="s4c" && S.sol==="seats"){ S.seatTried=true; S.seatMsg=true; S.sol=null; report([{q:"seats",v:1}]); return; }
  S.seatMsg = false;
  S.decided = true;
  if(scr==="s1") report([{q:"s1",v:S.s1}]);
  if(scr==="s2") report([{q:"s2",v:S.sh.slice()}]);
  if(scr==="s3") report([{q:"s3",v:S.tech.slice()}]);
  if(scr==="s4a") report(QUIZ.map((_,i)=>({q:"q"+(i+1),v:S.quiz[i]})));
  if(scr==="s4b") report([{q:"s4b",v:S.musts.slice()}]);
  if(scr==="s4c") report([{q:"s4c",v:S.sol}]);
  if(scr==="s5") report([{q:"ev_"+S.events[S.ev],v:S.evChoice[S.events[S.ev]]}]);
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]"); if(!b||b.disabled) return;
  const [a,x,y]=b.dataset.act.split(":");
  if(a==="to"){ go(x); return; }
  if(a==="back"){ back(); return; }
  if(a==="restart"){ S=init(); history.length=0; entrySnap=JSON.stringify(S); render(); window.scrollTo(0,0); return; }
  if(a==="nextev"){ history.push(entrySnap); S.ev++; S.decided=false; S.newCards=[]; entrySnap=JSON.stringify(S); render(); window.scrollTo(0,0); return; }
  if(a==="decide"){ decide(x); render(); return; }
  if(a==="s1") S.s1=x;
  if(a==="s2") toggle(S.sh,x,3);
  if(a==="s3") toggle(S.tech,x,2);
  if(a==="q") S.quiz[+x]=+y;
  if(a==="s4b") toggle(S.musts,x,3);
  if(a==="s4c") S.sol=x;
  if(a==="ev") S.evChoice[S.events[S.ev]]=x;
  const y0=window.scrollY; render(); window.scrollTo(0,y0);
});
$("#drawerToggle").addEventListener("click",()=>{
  const l=$("#cardList"); l.classList.toggle("hide");
  $("#drawerHint").textContent = l.classList.contains("hide")?"（タップで開く）":"（タップで閉じる）";
});
render();
</script>
